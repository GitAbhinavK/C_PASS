{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h3>SMPP Connections</h3>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Connect Name</th>
                <th>IP</th>
                <th>User</th>
                <th>Bind Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for c in connections %}
            <tr id="row-{{ c.smpp_id }}">
                <td>{{ c.smpp_id }}</td>
                <td>{{ c.connect_name }}</td>
                <td>{{ c.ip }}</td>
                <td>{{ c.username }}</td>
                <td id="status-{{ c.smpp_id }}">{{ c.bind_status }}</td>
                <td>
                    <button class="btn btn-success btn-sm start-btn" data-id="{{ c.smpp_id }}">Start</button>
                    <button class="btn btn-danger btn-sm stop-btn" data-id="{{ c.smpp_id }}">Stop</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll(".start-btn").forEach(btn => {
        btn.addEventListener("click", function() {
            const id = this.dataset.id;
            fetch(`/smpp/start/${id}/`)
            .then(res => res.json())
            .then(data => {
                alert(data.status);
                document.getElementById(`status-${id}`).innerText = data.bind_status;
            });
        });
    });

    document.querySelectorAll(".stop-btn").forEach(btn => {
        btn.addEventListener("click", function() {
            const id = this.dataset.id;
            fetch(`/smpp/stop/${id}/`)
            .then(res => res.json())
            .then(data => {
                alert(data.status);
                document.getElementById(`status-${id}`).innerText = data.bind_status;
            });
        });
    });
});

function updateStatus() {
    fetch('/smpp/')
    .then(res => res.text())
    .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        doc.querySelectorAll('tr[id^="row-"]').forEach(row => {
            const id = row.id.split('-')[1];
            const statusCell = document.getElementById(`status-${id}`);
            const newStatus = doc.getElementById(`status-${id}`).innerText;
            statusCell.innerText = newStatus;
        });
    });
}

// Refresh status every 10 seconds
setInterval(updateStatus, 10000);


</script>
{% endblock %}
