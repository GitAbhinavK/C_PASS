{% extends 'base.html' %}
{% load static %}
{% block title %}Add SMPP Connection{% endblock %}

{% block content %}
<style>
    :root {
        --theme-color: {{ user_company.attributes_1|default:'#FF6600' }};
    }

    .bg-theme { background-color: var(--theme-color) !important; }
    .text-theme { color: var(--theme-color) !important; }
    .btn-theme { background-color: var(--theme-color) !important; color: #fff; border: none; }
    .btn-theme:hover { opacity: 0.9; }

    .card {
        border-radius: 14px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        margin-bottom: 1.5rem;
    }
    .card-header {
        font-weight: 600;
        background-color: rgba(0,0,0,0.03);
    }
    input, textarea, select {
        border-radius: 8px !important;
    }
    .form-section {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1rem;
    }
    
    /* Hide class for RX fields */
    .rx-field {
        display: block;
    }
    .rx-field.hidden {
        display: none !important;
    }
</style>

<div class="container py-4">
    <h4 class="text-theme mb-4"><i class="bi bi-router"></i> Add SMPP Connection</h4>

    <form id="smppForm" method="POST" action="{% url 'add_smpp' %}">
        {% csrf_token %}

        <!-- SECTION 1: GENERAL INFORMATION -->
        <div class="card">
            <div class="card-header text-theme">
                <i class="bi bi-info-circle"></i> General Information
            </div>

            <div class="card-body form-section">

                <div>
                    <label class="form-label">Connect Name <span class="text-danger">*</span></label>
                    <input name="connect_name" class="form-control" placeholder="Enter connection name" required>
                </div>

                <div>
                    <label class="form-label">Billing Method</label>
                    <select name="billing_method" class="form-select">
                        <option value="">-- Select Billing Method --</option>
                        <option value="submission">Submission</option>
                        <option value="delivery">Delivery</option>
                    </select>
                </div>

                <div>
                    <label class="form-label">Account Type</label>
                    <select name="account_type" class="form-select">
                        <option value="">-- Select Account Type --</option>
                        <option value="transactional">Transactional</option>
                        <option value="promotional">Promotional</option>
                    </select>
                </div>

                <div>
                    <label class="form-label">Error Code Map</label>
                    <textarea name="error_code_map" class="form-control" placeholder="Enter error code mapping"></textarea>
                </div>

                <div>
                    <label class="form-label">IP <span class="text-danger">*</span></label>
                    <input name="ip" class="form-control" placeholder="Example: 192.168.1.10" required>
                </div>

                <div>
                    <label class="form-label">Username <span class="text-danger">*</span></label>
                    <input name="username" class="form-control" placeholder="Enter SMPP username" required>
                </div>

                <div>
                    <label class="form-label">Password <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control" placeholder="Enter SMPP password" required>
                </div>

                <div>
                    <label class="form-label">Bind Type <span class="text-danger">*</span></label>
                    <select name="bind_type" id="bindType" class="form-select" required>
                        <option value="">-- Select Bind Type --</option>
                        <option value="transmitter">Transmitter</option>
                        <option value="receiver">Receiver</option>
                        <option value="transceiver">Transceiver</option>
                    </select>
                </div>

                <div>
                    <label class="form-label">TPS</label>
                    <input type="number" name="tps" class="form-control" placeholder="Transactions per second" min="1">
                </div>

                <div>
                    <label class="form-label">TR/TRX Port</label>
                    <input type="number" name="tr_trx_port" class="form-control" placeholder="Enter TX/TRX port number" min="1">
                </div>

                <div>
                    <label class="form-label">TX Sessions</label>
                    <input type="number" name="tx_sessions" class="form-control" placeholder="Enter TX sessions count" min="1">
                </div>

                <!-- RX Port Field - Will be hidden for Transceiver -->
                <div class="rx-field" id="rxPortField">
                    <label class="form-label">RX Port</label>
                    <input type="number" name="rx_port" id="rxPort" class="form-control" placeholder="Enter RX port number" min="1">
                </div>

                <!-- RX Sessions Field - Will be hidden for Transceiver -->
                <div class="rx-field" id="rxSessionsField">
                    <label class="form-label">RX Sessions</label>
                    <input type="number" name="rx_sessions" id="rxSessions" class="form-control" placeholder="Enter RX sessions count" min="1">
                </div>

                <input type="hidden" name="smpp_connect_status" value="active">

            </div>
        </div>

        <!-- SECTION 2: DLR & DLT SETTINGS -->
        <div class="card">
            <div class="card-header text-theme">
                <i class="bi bi-sliders"></i> DLR & DLT Settings
            </div>

            <div class="card-body form-section">

                <div>
                    <label class="form-label">System Type</label>
                    <input name="system_type" class="form-control" placeholder="Example: SMPP" value="SMPP" readonly>
                </div>

                <div>
                    <label class="form-label">Dest Addr TON</label>
                    <input name="dest_addr_ton" class="form-control" placeholder="Enter TON value" value="1" readonly>
                </div>

                <div>
                    <label class="form-label">Dest Addr NPI</label>
                    <input name="dest_addr_npi" class="form-control" placeholder="Enter NPI value" value="1" readonly>
                </div>

                <div>
                    <label class="form-label">Source Addr TON</label>
                    <input name="source_addr_ton" class="form-control" placeholder="Enter source TON" value="1" readonly>
                </div>

                <div>
                    <label class="form-label">Source Addr NPI</label>
                    <input name="source_addr_npi" class="form-control" placeholder="Enter source NPI" value="1" readonly>
                </div>

                <div>
                    <label class="form-label">Delivery Report Timezone</label>
                    <select name="delivery_report_timezone" class="form-select">
                        <option value="">-- Select Timezone --</option>
                        {% for tz in timezones %}
                        <option value="{{ tz }}">{{ tz }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="form-label">Override Delivery Time Flag</label>
                    <select name="override_delivery_time_flag" class="form-select">
                        <option value="">-- Select Option --</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div>
                    <label class="form-label">Support Message Validity</label><br>
                    <input type="checkbox" name="support_message_validity"> Enable
                </div>

                <div>
                    <label class="form-label">Date Format in DLR</label>
                    <select name="date_format_in_dlr" class="form-select">
                        <option value="">-- Select Format --</option>
                        <option value="yyyy-mm-dd">YYYY-MM-DD</option>
                        <option value="dd-mm-yyyy">DD-MM-YYYY</option>
                        <option value="mm-dd-yyyy">MM-DD-YYYY</option>
                        <option value="yyyy/mm/dd">YYYY/MM/DD</option>
                    </select>
                </div>

                <div>
                    <label class="form-label">Modify Time Zone</label>
                    <select name="modify_time_zone" class="form-select">
                        <option value="">-- Select Option --</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div>
                    <label class="form-label">Enable DLT</label><br>
                    <input type="checkbox" name="dlt_enable"> Enable
                </div>

                <div>
                    <label class="form-label">DLT Telemarketer ID</label>
                    <input name="dlt_telemarketer_id" class="form-control" placeholder="Enter telemarketer ID">
                </div>

                <div>
                    <label class="form-label">Send DLT Template ID</label><br>
                    <input type="checkbox" name="send_dlt_template_id"> Enable
                </div>

                <div>
                    <label class="form-label">Reject Non-DLT Template Message</label><br>
                    <input type="checkbox" name="reject_non_dlt_template_message"> Enable
                </div>

                <div>
                    <label class="form-label">DLT Entity ID Tag</label>
                    <input name="dlt_entity_id_tag" value="tag_1400" class="form-control" placeholder="tag_1400">
                </div>

                <div>
                    <label class="form-label">DLT Template ID Tag</label>
                    <input name="dlt_template_id_tag" value="tag_1401" class="form-control" placeholder="tag_1401">
                </div>

                <div>
                    <label class="form-label">DLT Telemarketer ID Tag</label>
                    <input name="dlt_telemarketer_id_tag" value="tag_1402" class="form-control" placeholder="tag_1402">
                </div>

                <div>
                    <label class="form-label">DLT Telemarketer Tag Behaviour</label>
                    <select name="dlt_telemarketer_tag_behaviour" class="form-select">
                        <option value="">-- Select Behaviour --</option>
                        <option value="do_nothing">Do Nothing</option>
                        <option value="pass_tmid">Pass Only TMID</option>
                        <option value="plaintext_chain">Pass Chain (Plain Text)</option>
                        <option value="hash_chain">Pass Chain (Hash)</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- SUBMIT BUTTON -->
        <div class="text-end mt-3">
            <a href="{% url 'smpp_form' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-theme">
                <i class="bi bi-save"></i> Save SMPP Connection
            </button>
        </div>
    </form>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!-- JavaScript for Dynamic Fields and SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const themeColor = "{{ user_company.attributes_1|default:'#FF6600' }}";
    const redirectUrl = "{% url 'smpp_form' %}";  // This should be your connections list URL
    
    // ========== 1. BIND TYPE DYNAMIC FIELD HANDLING ==========
    const bindTypeSelect = document.getElementById('bindType');
    const rxPortField = document.getElementById('rxPortField');
    const rxSessionsField = document.getElementById('rxSessionsField');
    const rxPortInput = document.getElementById('rxPort');
    const rxSessionsInput = document.getElementById('rxSessions');
    
    function handleBindTypeChange() {
        const selectedValue = bindTypeSelect.value;
        
        if (selectedValue === 'transceiver') {
            // Hide RX fields for Transceiver
            rxPortField.classList.add('hidden');
            rxSessionsField.classList.add('hidden');
            // Clear RX inputs
            rxPortInput.value = '';
            rxSessionsInput.value = '';
        } else {
            // Show RX fields for Transmitter and Receiver
            rxPortField.classList.remove('hidden');
            rxSessionsField.classList.remove('hidden');
        }
    }
    
    // Initial check on page load
    handleBindTypeChange();
    
    // Add event listener for bind type change
    if (bindTypeSelect) {
        bindTypeSelect.addEventListener('change', handleBindTypeChange);
    }
    
    // ========== 2. FORM SUBMISSION WITH SWEETALERT ==========
    const smppForm = document.getElementById('smppForm');
    
    if (smppForm) {
        smppForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const formData = new FormData(smppForm);
            const connectName = formData.get('connect_name') || 'Not specified';
            const ip = formData.get('ip') || 'Not specified';
            const bindType = formData.get('bind_type') || 'Not specified';
            
            // Basic validation
            const requiredFields = ['connect_name', 'ip', 'username', 'password', 'bind_type'];
            let missingFields = [];
            
            requiredFields.forEach(field => {
                if (!formData.get(field)) {
                    const fieldName = field.replace('_', ' ');
                    missingFields.push(fieldName);
                }
            });
            
            if (missingFields.length > 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Missing Required Fields',
                    html: `<div class="text-start">
                        <p>Please fill in the following required fields:</p>
                        <ul class="text-danger">
                            ${missingFields.map(f => `<li>${f}</li>`).join('')}
                        </ul>
                    </div>`,
                    confirmButtonColor: themeColor,
                    confirmButtonText: 'OK'
                });
                return;
            }
            
            // Show confirmation SweetAlert
            Swal.fire({
                title: 'Confirm SMPP Connection Creation',
                html: `
                    <div class="text-start">
                        <p>Are you sure you want to create this SMPP connection?</p>
                        <div class="alert alert-info mt-3">
                            <small>
                                <strong>Connection Details:</strong><br>
                                • Name: <strong>${connectName}</strong><br>
                                • IP: ${ip}<br>
                                • Bind Type: ${bindType}
                            </small>
                        </div>
                    </div>
                `,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: themeColor,
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Yes, Create Connection',
                cancelButtonText: 'Cancel',
                reverseButtons: true,
                allowOutsideClick: false
            }).then((result) => {
                if (result.isConfirmed) {
                    // Show loading message
                    Swal.fire({
                        title: 'Creating SMPP Connection...',
                        text: 'Please wait while we save your configuration',
                        allowOutsideClick: false,
                        didOpen: () => {
                            Swal.showLoading();
                        }
                    });
                    
                    // Submit form via AJAX to show success message
                    fetch(smppForm.action, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-CSRFToken': '{{ csrf_token }}'
                        }
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            // Show success message
                            Swal.fire({
                                icon: 'success',
                                title: 'Success!',
                                html: `
                                    <div class="text-center">
                                        <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
                                        <h5 class="mt-3">SMPP Connection Created</h5>
                                        <p>${data.message || 'SMPP connection created successfully!'}</p>
                                        <div class="alert alert-info mt-3 text-start">
                                            <small>
                                                <strong>Connection Details:</strong><br>
                                                • Name: ${connectName}<br>
                                                • IP: ${ip}<br>
                                                • Bind Type: ${bindType}
                                            </small>
                                        </div>
                                    </div>
                                `,
                                confirmButtonColor: themeColor,
                                confirmButtonText: 'Go to Connections List',
                                showCancelButton: true,
                                cancelButtonText: 'Add Another',
                                allowOutsideClick: false
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    // Redirect to connections list
                                    window.location.href = redirectUrl;
                                } else if (result.dismiss === Swal.DismissReason.cancel) {
                                    // Reset form for adding another
                                    smppForm.reset();
                                    // Reset RX fields visibility
                                    handleBindTypeChange();
                                    // Set default values for readonly fields
                                    document.querySelector('[name="system_type"]').value = 'SMPP';
                                    document.querySelector('[name="dest_addr_ton"]').value = '1';
                                    document.querySelector('[name="dest_addr_npi"]').value = '1';
                                    document.querySelector('[name="source_addr_ton"]').value = '1';
                                    document.querySelector('[name="source_addr_npi"]').value = '1';
                                    // Focus on first field
                                    document.querySelector('[name="connect_name"]').focus();
                                }
                            });
                        } else {
                            // Show error message
                            Swal.fire({
                                icon: 'error',
                                title: 'Error!',
                                html: `
                                    <div class="text-center">
                                        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
                                        <h5 class="mt-3">Failed to Create SMPP Connection</h5>
                                        <p>${data.message || 'Unknown error occurred'}</p>
                                    </div>
                                `,
                                confirmButtonColor: '#dc3545',
                                confirmButtonText: 'OK'
                            });
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        // If AJAX fails, submit form normally
                        Swal.fire({
                            icon: 'warning',
                            title: 'Submitting Form...',
                            text: 'Using standard form submission',
                            timer: 1500,
                            showConfirmButton: false
                        }).then(() => {
                            smppForm.submit();
                        });
                    });
                }
            });
        });
    }
});
</script>

{% endblock %}
